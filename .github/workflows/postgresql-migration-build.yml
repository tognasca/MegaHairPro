name: PostgreSQL migration branch build

on:
  push:
    branches:
      - feature/postgresql-migration
  pull_request:
    branches:
      - master

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      - name: Restore
        run: dotnet restore MegaHairPro.sln
      - name: Build
        run: dotnet build MegaHairPro.sln --configuration Release --no-restore
